<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaTech - Novo Serviço</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 16px;
        }

        h1 {
            color: #1a3c6e;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1a3c6e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Novo serviço</h1>
    <form th:action="@{/servicos/salvar}" th:object="${servico}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="cliente">Cliente</label>
        <select id="cliente" th:field="*{cliente}" required>
            <option value="">Selecionar cliente</option>
            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
        </select>

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" th:field="*{descricao}" required>

        <label for="dataEntrada">Data de entrada</label>
        <input type="date" id="dataEntrada" th:field="*{dataEntrada}">

        <label for="previsaoEntrega">Previsão de entrega</label>
        <input type="date" id="previsaoEntrega" th:field="*{previsaoEntrega}">

        <button type="submit">CADASTRAR SERVIÇO</button>
    </form>
</body>

</html>
