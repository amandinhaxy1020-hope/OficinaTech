<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaTech - Registrar Resíduo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 16px;
        }

        h1 {
            color: #1a3c6e;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1a3c6e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Novo registro de resíduo</h1>
    <form th:action="@{/residuos/salvar}" th:object="${residuo}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="tipo">Tipo (ex: Óleo, Metal, Papel)</label>
        <input type="text" id="tipo" th:field="*{tipo}" required>

        <label for="quantidade">Quantidade</label>
        <input type="number" step="0.01" id="quantidade" th:field="*{quantidade}" required>

        <label for="unidade">Unidade (ex: Litros, kg, un.)</label>
        <input type="text" id="unidade" th:field="*{unidade}" required>

        <label for="data">Data</label>
        <input type="date" id="data" th:field="*{data}" required>

        <label for="destino">Destino</label>
        <input type="text" id="destino" th:field="*{destino}">

        <label for="observacao">Observação</label>
        <textarea id="observacao" th:field="*{observacao}" rows="3"></textarea>

        <button type="submit">REGISTRAR</button>
    </form>
</body>

</html>
