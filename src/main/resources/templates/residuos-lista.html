<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaTech - Resíduos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 16px;
        }

        h1 {
            color: #1a3c6e;
            margin-bottom: 16px;
        }

        .top-bar {
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 20px;
            background: #1a3c6e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .tipo {
            font-weight: bold;
            font-size: 16px;
            color: #1a3c6e;
        }

        .info {
            font-size: 14px;
            color: #333;
            margin: 4px 0;
        }

        .obs {
            font-size: 13px;
            color: #666;
            font-style: italic;
        }

        .voltar {
            display: inline-block;
            margin-top: 16px;
            color: #1a3c6e;
        }
    </style>
</head>

<body>
    <h1>Resíduos</h1>

    <div class="top-bar">
        <a class="btn" th:href="@{/residuos/novo}">+ Registrar Resíduo</a>
    </div>

    <div class="card" th:each="residuo : ${residuos}">
        <div class="tipo" th:text="${residuo.tipo}">Tipo</div>
        <div class="info" th:text="${residuo.quantidade + ' ' + residuo.unidade + ' — ' + residuo.data}">Info</div>
        <div class="info" th:if="${residuo.destino}" th:text="'Destino: ' + ${residuo.destino}">Destino</div>
        <div class="obs" th:if="${residuo.observacao}" th:text="${residuo.observacao}">Obs</div>
    </div>

    <a class="voltar" th:href="@{/dashboard}">&larr; Voltar ao painel</a>
</body>

</html>
