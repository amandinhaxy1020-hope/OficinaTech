<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaTech - Materiais</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 16px;
        }

        h1 {
            color: #1a3c6e;
            margin-bottom: 16px;
        }

        .top-bar {
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 20px;
            background: #1a3c6e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .nome {
            font-weight: bold;
            font-size: 16px;
            color: #1a3c6e;
        }

        .qtd {
            font-size: 14px;
            color: #333;
            margin: 4px 0;
        }

        .aviso {
            background: #fff3cd;
            color: #856404;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .acoes {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .acoes input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .acoes button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
        }

        .btn-entrada {
            background: #2e7d32;
        }

        .btn-saida {
            background: #b3261e;
        }

        .voltar {
            display: inline-block;
            margin-top: 16px;
            color: #1a3c6e;
        }
    </style>
</head>

<body>
    <h1>Materiais</h1>

    <div class="top-bar">
        <a class="btn" th:href="@{/materiais/novo}">+ Novo Material</a>
    </div>

    <div class="card" th:each="material : ${materiais}">
        <div class="nome" th:text="${material.nome}">Nome</div>
        <div class="qtd" th:text="${material.quantidade + ' ' + material.unidade}">10 L</div>

        <div class="aviso" th:if="${material.quantidade < material.quantidadeMinima}">
            ⚠️ Estoque baixo
        </div>

        <div class="acoes">
            <form th:action="@{/materiais/{id}/entrada(id=${material.id})}" method="post"
                style="display:flex; gap:4px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="number" step="0.01" name="quantidade" placeholder="Qtd" required>
                <button class="btn-entrada" type="submit">Entrada</button>
            </form>
            <form th:action="@{/materiais/{id}/saida(id=${material.id})}" method="post" style="display:flex; gap:4px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="number" step="0.01" name="quantidade" placeholder="Qtd" required>
                <button class="btn-saida" type="submit">Saída</button>
            </form>
        </div>
    </div>

    <a class="voltar" th:href="@{/dashboard}">&larr; Voltar ao painel</a>
</body>

</html>
